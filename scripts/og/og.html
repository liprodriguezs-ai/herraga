<!doctype html>
<!--
  Share image (Open Graph / Twitter card) for herraga.com, 1200x630.
  Regenerate: open this file in a 1200x630 browser viewport, screenshot it,
  and save as public/og-herraga-<year>.jpg (JPEG, quality ~85). Use a new file name each
  time so Facebook, WhatsApp and X drop their cached copy, and update Layout.astro.
-->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>HERRAGA share image</title>
<style>
  @font-face {
    font-family: 'Big Shoulders Display';
    src: url('../../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Barlow Condensed';
    src: url('../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Barlow';
    src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2') format('woff2');
    font-weight: 500;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #041d27; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    color: #fff;
    background:
      linear-gradient(90deg, rgb(4 29 39 / 0.94) 0%, rgb(4 29 39 / 0.78) 45%, rgb(4 29 39 / 0.2) 100%),
      linear-gradient(180deg, rgb(4 29 39 / 0) 60%, #041d27 100%),
      url('../../src/assets/hero/cab-duotone.jpg') right 25% / cover no-repeat;
  }

  .lights {
    display: flex;
    justify-content: center;
    gap: 64px;
    padding-top: 26px;
  }
  .lights span {
    width: 54px;
    height: 16px;
    border-radius: 999px;
    background: radial-gradient(60% 90% at 50% 35%, #ffd27a, #ffb22e 55%, #b86d00 100%);
    box-shadow: 0 0 0 2px #2b3a40, 0 0 0 3px rgb(255 255 255 / 0.25), 0 0 20px 5px rgb(255 178 46 / 0.55);
  }

  .body {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 64px;
  }
  .copy { flex: 1; display: grid; gap: 18px; }

  .headline {
    display: grid;
    gap: 4px;
  }
  /* Each line carries its own chrome horizon, like the lettering on the site. */
  .headline span {
    justify-self: start;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 96px;
    line-height: 0.92;
    /* Room for the accent on DETRÁS: background-clip only paints inside the box. */
    padding-top: 0.16em;
    margin-top: -0.16em;
    white-space: nowrap;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fdfeff 0%, #d5dfe6 22%, #f4f8fa 46%, #57636c 52%, #2e363d 58%, #9d9283 74%, #ebe6de 92%, #fdfeff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 0 rgb(0 0 0 / 0.6));
  }
  .subline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #ff3b47;
  }
  .meta {
    display: flex;
    gap: 22px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    font-size: 24px;
    color: #d3dee3;
  }
  .meta b { color: #ffb22e; font-weight: 500; }

  /* Call to action: same trim plate as the site's primary WhatsApp button (.btn--primary). */
  .cta {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-top: 6px;
    padding: 14px 30px 14px 24px;
    border-radius: 6px;
    background: #c0101f;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / 0.28),
      inset 0 -3px 0 rgb(0 0 0 / 0.25),
      0 0 0 3px rgb(255 59 71 / 0.35),
      0 16px 30px -12px rgb(0 0 0 / 0.8);
  }
  .cta svg { width: 38px; height: 38px; flex: none; fill: currentColor; }

  .badge {
    flex: none;
    width: 300px;
    display: grid;
    justify-items: center;
    gap: 16px;
    padding: 30px 28px 24px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgb(11 54 71 / 0.92), rgb(4 29 39 / 0.92));
    box-shadow: 0 0 0 4px #c9d2d7, 0 0 0 7px #5c6a71, 0 30px 50px -18px rgb(0 0 0 / 0.8);
  }
  .badge img { width: 100%; height: auto; }
  .badge .url {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: #fff;
  }

  .bumper {
    display: flex;
    justify-content: space-between;
    padding: 16px 64px;
    background:
      linear-gradient(100deg, transparent 18%, rgb(255 255 255 / 0.6) 30%, transparent 38%),
      linear-gradient(180deg, #ffffff 0%, #e3eaef 38%, #b7c2c9 52%, #c9d1d6 60%, #ddd8d0 82%, #f4f2ee 100%);
    box-shadow: inset 0 3px 0 rgb(255 255 255 / 0.8), inset 0 -4px 0 rgb(0 0 0 / 0.25);
    color: #041d27;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 850;
    font-size: 26px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lights"><span></span><span></span><span></span><span></span><span></span></div>

    <div class="body">
      <div class="copy">
        <div class="headline"><span>La fuerza detrás</span><span>de tu motor</span></div>
        <div class="subline">Refacciones diésel para motores<br>de rango medio y pesado</div>
        <div class="meta"><span><b>✓</b> Originales y con garantía</span><span><b>✓</b> Envíos a todo México</span></div>
        <div class="cta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.62-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.12-.27-.2-.57-.35zM12.05 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.43 9.88-9.88 9.88zm8.41-18.3A11.81 11.81 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41z"/></svg>Cotiza por WhatsApp</div>
      </div>

      <div class="badge">
        <img src="../../src/assets/brand/logo-dark.svg" alt="">
        <span class="url">WWW.HERRAGA.COM</span>
      </div>
    </div>

    <div class="bumper">
      <span>Cummins</span><span>Detroit</span><span>Volvo</span><span>Navistar</span><span>CAT</span><span>Mack</span><span>Mercedes-Benz</span><span>IPD</span>
    </div>
  </div>
</body>
</html>
