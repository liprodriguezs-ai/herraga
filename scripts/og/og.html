<!doctype html>
<!--
  Share image (Open Graph / Twitter card) for herraga.com, 1200x630.
  Regenerate: open this file in a 1200x630 browser viewport, screenshot it,
  and save as public/og-herraga-<year>.jpg (JPEG, quality ~85). Use a new file name each
  time so Facebook, WhatsApp and X drop their cached copy, and update Layout.astro.
-->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>HERRAGA share image</title>
<style>
  @font-face {
    font-family: 'Big Shoulders Display';
    src: url('../../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Barlow Condensed';
    src: url('../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Barlow';
    src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2') format('woff2');
    font-weight: 500;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #041d27; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    color: #fff;
    background:
      linear-gradient(90deg, rgb(4 29 39 / 0.94) 0%, rgb(4 29 39 / 0.78) 45%, rgb(4 29 39 / 0.2) 100%),
      linear-gradient(180deg, rgb(4 29 39 / 0) 60%, #041d27 100%),
      url('../../src/assets/hero/cab-duotone.jpg') right 25% / cover no-repeat;
  }

  .lights {
    display: flex;
    justify-content: center;
    gap: 64px;
    padding-top: 26px;
  }
  .lights span {
    width: 54px;
    height: 16px;
    border-radius: 999px;
    background: radial-gradient(60% 90% at 50% 35%, #ffd27a, #ffb22e 55%, #b86d00 100%);
    box-shadow: 0 0 0 2px #2b3a40, 0 0 0 3px rgb(255 255 255 / 0.25), 0 0 20px 5px rgb(255 178 46 / 0.55);
  }

  .body {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 64px;
  }
  .copy { flex: 1; display: grid; gap: 18px; }

  .headline {
    display: grid;
    gap: 4px;
  }
  /* Each line carries its own chrome horizon, like the lettering on the site. */
  .headline span {
    justify-self: start;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 96px;
    line-height: 0.92;
    /* Room for the accent on DETRÁS: background-clip only paints inside the box. */
    padding-top: 0.16em;
    margin-top: -0.16em;
    white-space: nowrap;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fdfeff 0%, #d5dfe6 22%, #f4f8fa 46%, #57636c 52%, #2e363d 58%, #9d9283 74%, #ebe6de 92%, #fdfeff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 0 rgb(0 0 0 / 0.6));
  }
  .subline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #ff3b47;
  }
  .meta {
    display: flex;
    gap: 22px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
    font-size: 24px;
    color: #d3dee3;
  }
  .meta b { color: #ffb22e; font-weight: 500; }

  .badge {
    flex: none;
    width: 300px;
    display: grid;
    justify-items: center;
    gap: 16px;
    padding: 30px 28px 24px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgb(11 54 71 / 0.92), rgb(4 29 39 / 0.92));
    box-shadow: 0 0 0 4px #c9d2d7, 0 0 0 7px #5c6a71, 0 30px 50px -18px rgb(0 0 0 / 0.8);
  }
  .badge img { width: 100%; height: auto; }
  .badge .url {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: #fff;
  }

  .bumper {
    display: flex;
    justify-content: space-between;
    padding: 16px 64px;
    background:
      linear-gradient(100deg, transparent 18%, rgb(255 255 255 / 0.6) 30%, transparent 38%),
      linear-gradient(180deg, #ffffff 0%, #e3eaef 38%, #b7c2c9 52%, #c9d1d6 60%, #ddd8d0 82%, #f4f2ee 100%);
    box-shadow: inset 0 3px 0 rgb(255 255 255 / 0.8), inset 0 -4px 0 rgb(0 0 0 / 0.25);
    color: #041d27;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 850;
    font-size: 26px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lights"><span></span><span></span><span></span><span></span><span></span></div>

    <div class="body">
      <div class="copy">
        <div class="headline"><span>La fuerza detrás</span><span>de tu motor</span></div>
        <div class="subline">Refacciones diésel para motores<br>de rango medio y pesado</div>
        <div class="meta"><span><b>✓</b> Originales y con garantía</span><span><b>✓</b> Envíos a todo México</span></div>
      </div>

      <div class="badge">
        <img src="../../src/assets/brand/logo-dark.svg" alt="">
        <span class="url">WWW.HERRAGA.COM</span>
      </div>
    </div>

    <div class="bumper">
      <span>Cummins</span><span>Detroit</span><span>Volvo</span><span>Navistar</span><span>CAT</span><span>Mack</span><span>Mercedes-Benz</span><span>IPD</span>
    </div>
  </div>
</body>
</html>
